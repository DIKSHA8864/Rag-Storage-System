services:
  postgres:
    # pgvector/pgvector:pg16 is upstream postgres:16 with the pgvector
    # extension compiled in (see database/migrations/0002_pgvector.sql's
    # CREATE EXTENSION) - the plain postgres:16 image doesn't have it,
    # and app/vector_store/vector_repository.py needs it for chunk
    # similarity search.
    image: pgvector/pgvector:pg16
    container_name: rag_storage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_storage
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d rag_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag_storage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible object storage - free, no account, no card.
  # app/storage/s3_backend.py talks to this in development and to real
  # AWS S3 / Cloudflare R2 in production; only S3_ENDPOINT_URL and the
  # credentials change. Buckets are created on first use by the
  # backend's _ensure_bucket(), so there's nothing to set up by hand.
  minio:
    image: minio/minio:latest
    container_name: rag_storage_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragminio
      MINIO_ROOT_PASSWORD: ragminio123
    ports:
      - "9000:9000"   # S3 API - S3_ENDPOINT_URL points here
      - "9001:9001"   # web console, for eyeballing objects
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
