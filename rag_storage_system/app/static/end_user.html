<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Analysis - Secure RAG Storage</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #6a737d;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #1a7f37;
    --ok-bg: #dcf5e0;
    --warn: #b35900;
    --warn-bg: #fff2d9;
    --err: #cf222e;
    --err-bg: #ffe3e3;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 1rem 1.5rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.85rem; }
  main { max-width: 860px; margin: 0 auto; padding: 1.5rem; }

  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  section.panel h2 { font-size: 0.95rem; margin: 0 0 0.75rem 0; }
  label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
  input, textarea, select {
    width: 100%;
    font-size: 0.9rem;
    padding: 0.55rem 0.7rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 120px; }
  .field { margin-bottom: 0.9rem; }
  .divider { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 0.75rem 0; }
  button {
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    color: var(--text);
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); width: 100%; font-weight: 600; }
  button.primary:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  #analyze-error { color: var(--err); font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.1em; }
  .hidden { display: none !important; }

  #spinner { text-align: center; padding: 2rem; color: var(--muted); }

  /* Report */
  .score-row { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
  .score-circle {
    width: 110px; height: 110px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    border: 6px solid var(--accent);
    flex-shrink: 0;
  }
  .score-circle .num { font-size: 1.6rem; font-weight: 700; }
  .score-circle .lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
  .score-meta { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .insufficient-banner {
    background: var(--warn-bg); color: var(--warn); padding: 0.75rem 1rem;
    border-radius: var(--radius); font-size: 0.88rem; margin-bottom: 1rem;
  }
  .exec-summary { font-size: 0.95rem; line-height: 1.5; margin-top: 0.75rem; }

  .item-group h3 {
    font-size: 0.9rem; margin: 1.25rem 0 0.6rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .item-group h3 .count { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
  .comparison-item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    margin-bottom: 0.6rem;
  }
  .comparison-item .input-text { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
  .comparison-item .input-text .lbl { font-weight: 600; color: var(--text); }
  .comparison-item .narrative { font-size: 0.9rem; margin-bottom: 0.5rem; }
  .tag {
    display: inline-block;
    font-size: 0.68rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    margin-right: 0.4rem;
  }
  .tag.match { background: var(--ok-bg); color: var(--ok); }
  .tag.partial_match { background: var(--warn-bg); color: var(--warn); }
  .tag.gap { background: var(--err-bg); color: var(--err); }
  .tag.conflict { background: var(--err-bg); color: var(--err); }
  .sources { margin-top: 0.5rem; }
  .source-chip {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0.35rem 0.5rem;
    border-left: 2px solid var(--border);
    margin-bottom: 0.3rem;
  }
  .source-chip b { color: var(--text); }
  .recommendations li { font-size: 0.9rem; margin-bottom: 0.4rem; }
  .provenance-legend {
    font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--border);
    padding-top: 0.75rem; margin-top: 1rem; line-height: 1.6;
  }
  .empty-note { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>Document Analysis</h1>
  <p>Paste text or upload a document to compare it against the knowledge base.</p>
</header>

<main>
  <section class="panel">
    <h2>Access key</h2>
    <div class="field">
      <label for="end-user-key">End User key (X-End-User-Key)</label>
      <input type="password" id="end-user-key" placeholder="Paste your End User key">
    </div>
  </section>

  <section class="panel">
    <h2>Submit for analysis</h2>

    <div class="field">
      <label for="query-text">Paste text to analyze</label>
      <textarea id="query-text" placeholder="Paste a policy, contract clause, or any text to compare against the knowledge base..."></textarea>
    </div>

    <div class="divider">— or —</div>

    <div class="field">
      <label for="file-input">Upload a document (PDF / DOCX / TXT)</label>
      <input type="file" id="file-input" accept=".pdf,.docx,.txt">
    </div>

    <div class="field">
      <label for="category-filter">Restrict to category (optional)</label>
      <input type="text" id="category-filter" placeholder="e.g. Contracts">
    </div>

    <button class="primary" id="analyze-btn">Analyze</button>
    <div id="analyze-error"></div>
  </section>
    <section class="panel">
    <h2>Ask a question</h2>
    <div class="field">
      <label for="ask-text">Question</label>
      <input type="text" id="ask-text" placeholder="Ask a question about the knowledge base...">
    </div>
    <button class="primary" id="ask-btn">Ask</button>
    <div id="ask-error" style="color: var(--err); font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.1em;"></div>

    <div id="ask-answer-panel" class="hidden" style="margin-top: 1rem;">
      <div id="ask-sources" style="font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem;"></div>
      <div id="ask-answer" style="font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap;"></div>
    </div>
  </section>
  <div id="spinner" class="hidden">Analyzing... this can take a few seconds.</div>

  <div id="report-container"></div>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  const savedKey = localStorage.getItem("end_user_key");
  if (savedKey) $("end-user-key").value = savedKey;

  const queryText = $("query-text");
  const fileInput = $("file-input");

  queryText.addEventListener("input", () => {
    if (queryText.value.trim()) fileInput.value = "";
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) queryText.value = "";
  });

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  $("analyze-btn").addEventListener("click", async () => {
    const key = $("end-user-key").value.trim();
    const errorEl = $("analyze-error");
    errorEl.textContent = "";

    if (!key) {
      errorEl.textContent = "Enter your End User key first.";
      return;
    }
    localStorage.setItem("end_user_key", key);

    const text = queryText.value.trim();
    const file = fileInput.files[0];
    const category = $("category-filter").value.trim();

    if (!text && !file) {
      errorEl.textContent = "Paste some text or choose a file to analyze.";
      return;
    }
    if (text && file) {
      errorEl.textContent = "Provide either pasted text or a file, not both.";
      return;
    }

    const formData = new FormData();
    if (text) formData.append("query", text);
    if (file) formData.append("file", file);
    if (category) formData.append("category", category);

    $("analyze-btn").disabled = true;
    $("spinner").classList.remove("hidden");
    $("report-container").innerHTML = "";

    try {
      const res = await fetch("/end-user/compare", {
        method: "POST",
        headers: { "X-End-User-Key": key },
        body: formData,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || `Request failed (${res.status}).`);
      renderReport(data);
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      $("analyze-btn").disabled = false;
      $("spinner").classList.add("hidden");
    }
  });

  $("ask-btn").addEventListener("click", async () => {
    const key = $("end-user-key").value.trim();
    const errorEl = $("ask-error");
    errorEl.textContent = "";

    if (!key) {
      errorEl.textContent = "Enter your End User key first.";
      return;
    }
    localStorage.setItem("end_user_key", key);

    const question = $("ask-text").value.trim();
    if (!question) {
      errorEl.textContent = "Type a question first.";
      return;
    }

    const answerPanel = $("ask-answer-panel");
    const sourcesEl = $("ask-sources");
    const answerEl = $("ask-answer");
    answerPanel.classList.remove("hidden");
    sourcesEl.textContent = "";
    answerEl.textContent = "";

    let sourcesLocked = false; // citation lock, client side: the first
                                 // "sources" event wins, permanently -
                                 // nothing later is allowed to touch it.

    $("ask-btn").disabled = true;

    try {
      const res = await fetch("/end-user/query/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-End-User-Key": key },
        body: JSON.stringify({ query: question }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${res.status}).`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          handleSseEvent(rawEvent);
        }
      }
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      $("ask-btn").disabled = false;
    }

    function handleSseEvent(rawEvent) {
      const lines = rawEvent.split("\n");
      const eventLine = lines.find((l) => l.startsWith("event: "));
      const dataLine = lines.find((l) => l.startsWith("data: "));
      if (!eventLine || !dataLine) return;

      const eventType = eventLine.slice("event: ".length);
      const data = JSON.parse(dataLine.slice("data: ".length));

      if (eventType === "sources") {
        if (sourcesLocked) return; // ignore any later "sources" event
        sourcesLocked = true;
        sourcesEl.innerHTML = data.sources.length
          ? "Sources: " + data.sources.map((s) => escapeHtml(s.filename)).join(", ")
          : "No matching sources found.";
      } else if (eventType === "answer_chunk") {
        answerEl.textContent += data.text;
      } else if (eventType === "error") {
        errorEl.textContent = data.detail;
      }
      // "done" needs no handling - the loop above ends when the
      // stream closes.
    }
  });

  
  function renderReport(report) {
    const container = $("report-container");
    container.innerHTML = "";

    const panel = document.createElement("section");
    panel.className = "panel";

    let html = "";

    if (report.insufficient_evidence) {
      html += `<div class="insufficient-banner">⚠ ${escapeHtml(report.executive_summary.text)}</div>`;
    }

    const b = report.match_score_breakdown;
    html += `
      <div class="score-row">
        <div class="score-circle">
          <div class="num">${Math.round(report.overall_match_score)}</div>
          <div class="lbl">/ 100</div>
        </div>
        <div class="score-meta">
          <div>Coverage: ${(b.coverage_ratio * 100).toFixed(0)}% (weight ${b.coverage_weight})</div>
          <div>Avg. confidence: ${(b.avg_confidence * 100).toFixed(0)}% (weight ${b.confidence_weight})</div>
        </div>
      </div>
    `;

    if (!report.insufficient_evidence) {
      html += `<div class="exec-summary">${escapeHtml(report.executive_summary.text)}</div>`;
    }

    panel.innerHTML = html;
    container.appendChild(panel);

    const groups = [
      { key: "similarities", label: "Similarities", cls: "match" },
      { key: "differences", label: "Differences", cls: "partial_match" },
      { key: "gaps", label: "Gaps", cls: "gap" },
      { key: "conflicts", label: "Conflicts", cls: "conflict" },
    ];

    const matchingPanel = document.createElement("section");
    matchingPanel.className = "panel";
    matchingPanel.innerHTML = `<h2>Detailed matching</h2>`;

    for (const g of groups) {
      const items = report.detailed_matching[g.key] || [];
      const groupDiv = document.createElement("div");
      groupDiv.className = "item-group";
      groupDiv.innerHTML = `<h3>${g.label} <span class="count">(${items.length})</span></h3>`;

      if (items.length === 0) {
        groupDiv.innerHTML += `<div class="empty-note">None found.</div>`;
      } else {
        for (const item of items) {
          groupDiv.appendChild(renderComparisonItem(item, g.cls));
        }
      }
      matchingPanel.appendChild(groupDiv);
    }
    container.appendChild(matchingPanel);

    if (report.recommendations && report.recommendations.length) {
      const recPanel = document.createElement("section");
      recPanel.className = "panel";
      recPanel.innerHTML = `<h2>Recommendations</h2><ul class="recommendations">` +
        report.recommendations.map(r => `<li>${escapeHtml(r.text)}</li>`).join("") +
        `</ul>`;
      container.appendChild(recPanel);
    }

    if (report.sources && report.sources.length) {
      const srcPanel = document.createElement("section");
      srcPanel.className = "panel";
      srcPanel.innerHTML = `<h2>Sources (${report.sources.length})</h2>` +
        report.sources.map(s => renderSourceChip(s)).join("");
      container.appendChild(srcPanel);
    }

    const legendPanel = document.createElement("section");
    legendPanel.className = "panel";
    const legendEntries = Object.entries(report.provenance_legend || {});
    legendPanel.innerHTML = `<div class="provenance-legend">` +
      legendEntries.map(([k, v]) => `<div><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</div>`).join("") +
      `</div>`;
    container.appendChild(legendPanel);
  }

  function renderComparisonItem(item, tagCls) {
    const div = document.createElement("div");
    div.className = "comparison-item";
    const tags = `<span class="tag ${tagCls}">${escapeHtml(item.classification)}</span>` +
      (item.is_conflict ? `<span class="tag conflict">conflict</span>` : "");
    div.innerHTML = `
      <div>${tags}<span style="font-size:0.75rem;color:var(--muted);">score ${item.top_score.toFixed(2)}</span></div>
      <div class="input-text"><span class="lbl">Submitted:</span> ${escapeHtml(truncate(item.input_text, 240))}</div>
      <div class="narrative">${escapeHtml(item.narrative.text)}</div>
      <div class="sources">${item.sources.map(renderSourceChip).join("")}</div>
    `;
    return div;
  }

  function renderSourceChip(s) {
    const loc = [s.chapter, s.section].filter(Boolean).join(" / ");
    const pages = (s.start_page != null) ? `p. ${s.start_page}${s.end_page && s.end_page !== s.start_page ? "-" + s.end_page : ""}` : "";
    const meta = [s.category, loc, pages].filter(Boolean).join(" · ");
    return `<span class="source-chip"><b>${escapeHtml(s.filename)}</b> ${meta ? "— " + escapeHtml(meta) : ""} (score ${s.score.toFixed(2)})</span>`;
  }

  function truncate(text, n) {
    return text.length > n ? text.slice(0, n) + "…" : text;
  }
})();
</script>
</body>
</html>
